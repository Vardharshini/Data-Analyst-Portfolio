<section class="contact-section" id="contact">

    <div class="section-heading">

        <p class="section-label">
            GET IN TOUCH
        </p>

        <h2>
            Let's Connect
        </h2>

        <div class="heading-line"></div>

    </div>


    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-info">

            <h3>
                Let's Work With Data
            </h3>

            <p>
                I'm open to Data Analyst, Junior Data Analyst,
                Business Analyst, and Business Intelligence
                opportunities.
            </p>


            <!-- EMAIL -->
            <div class="contact-detail">

                <i class="fa-solid fa-envelope"></i>

                <div>

                    <strong>
                        Email
                    </strong>

                    <a href="mailto:dharshur165@gmail.com">
                        dharshur165@gmail.com
                    </a>

                </div>

            </div>


            <!-- LINKEDIN -->
            <div class="contact-detail">

                <i class="fa-brands fa-linkedin"></i>

                <div>

                    <strong>
                        LinkedIn
                    </strong>

                    <a href="https://www.linkedin.com/in/vardharshini-dataanalyst/"
                       target="_blank">

                        LinkedIn Profile

                    </a>

                </div>

            </div>


            <!-- GITHUB -->
            <div class="contact-detail">

                <i class="fa-brands fa-github"></i>

                <div>

                    <strong>
                        GitHub
                    </strong>

                    <a href="https://vardharshini.github.io/Data-Analyst-Portfolio/"
                       target="_blank">

                        GitHub Profile

                    </a>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE FORM -->
        <form class="contact-form" id="contactForm">

            <div class="contact-row">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required>

            </div>


            <textarea
                name="message"
                placeholder="Your Message"
                required></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>
